# Pushing a tag like v1.1 (or v0.1-alpha) builds Barnacles.dmg and publishes it as a
# GitHub Release. The landing page and install.sh link to
# releases/latest/download/Barnacles.dmg, so they always get the newest one. That link
# skips releases marked as pre-releases, so alphas are published as normal releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Barnacles.dmg
        run: VERSION="${GITHUB_REF_NAME#v}" app/scripts/make-dmg.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/Barnacles.dmg --title "Barnacles ${GITHUB_REF_NAME#v}" --generate-notes
